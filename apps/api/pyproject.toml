[project]
name = "quoteflow-api"
version = "0.1.0"
description = "QuoteFlow proposal workspace API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.27,<1",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "langsmith>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quoteflow"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency declarations use Depends in defaults.
